<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UZB cash bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/video.js"></script>
<style>
:root{--bg:#0a1315;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.13);--text:#eef6f4;--muted:#8fa6a1;--acc:#3ee6c0;--acc2:#1fb897;--red:#ff6b7d;--warn:#ffcf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#143a38 0,#0a1315 60%) fixed;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.imm{padding:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text);outline:none}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
body.imm #app{display:none}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1.5px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ava{width:52px;height:52px;border-radius:50%;background:center/cover,linear-gradient(145deg,var(--acc),var(--acc2));border:2px solid rgba(62,230,192,.6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#06201a;flex:none}
.uname{flex:1;font-weight:800;font-size:18px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:22px;height:22px}
.ptitle{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ptitle h1{margin:0;font-size:22px;flex:1;text-align:center;padding-right:46px}
.ptitle .ib{padding:0}
.lab{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.bal{padding:18px 18px 12px;margin-bottom:18px}
.balrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.big{white-space:nowrap;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin-top:6px}
.big small{font-size:22px;color:var(--muted);font-weight:700;margin-left:4px}
.seg{display:flex;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:2px}
.seg button{white-space:nowrap;padding:8px 12px;border-radius:12px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:linear-gradient(145deg,#6ff2d4,#2fcfae);color:#05231c}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pill.g{color:var(--acc);border-color:rgba(62,230,192,.4);background:rgba(62,230,192,.1)}
.chart{width:100%;height:auto;display:block}
.sec{font-size:18px;font-weight:900;margin:20px 2px 10px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.gc img{width:100%;aspect-ratio:1;border-radius:18px;object-fit:cover;display:block}
.gc b{font-size:16px}
.gc span{font-size:12px;color:var(--acc);font-weight:700}
.cap{margin:12px 2px 0;font-size:12px;color:var(--muted)}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.1);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#7ff5da,#2fcfae)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{padding:14px 16px;border-radius:22px}
.stat .n{font-size:30px;font-weight:900;margin-top:4px}
.stat .n.g{color:var(--acc)}
.field{width:100%;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.4);border:1.5px solid var(--line);font-size:16px}
.field:focus{border-color:rgba(62,230,192,.6)}
.linkbox{padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.4);border:1.5px solid var(--line);font-size:14px;color:#cfe;word-break:break-all;margin:8px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:15px;border-radius:18px;font-weight:900;font-size:17px;text-align:center;border:1.5px solid var(--line);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.p{background:linear-gradient(145deg,#7ff5da,#2fcfae);color:#05231c;border-color:rgba(255,255,255,.4)}
.btn.d{color:var(--red)}
.btn.s{padding:10px 14px;font-size:14px;border-radius:14px;width:auto}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 2px}
.task{padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;border-radius:22px}
.task .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.07);flex:none}
.task .tx{flex:1;min-width:0}
.task b{display:block;font-size:15px}
.task small{color:var(--acc);font-weight:700}
.tabs{display:flex;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:18px;padding:5px;gap:4px;margin-bottom:14px;overflow:auto}
.tabs button{padding:10px 14px;border-radius:13px;font-weight:800;color:var(--muted);white-space:nowrap;flex:1}
.tabs button.on{background:linear-gradient(145deg,#6ff2d4,#2fcfae);color:#05231c}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.hrow .ic{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.hrow .t{flex:1;min-width:0}.hrow .t b{display:block;font-size:15px}.hrow .t small{color:var(--muted);font-size:12px}
.hrow .a{font-weight:900;font-size:16px}.a.p{color:var(--acc)}.a.m{color:var(--red)}
.chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(255,207,92,.15);color:var(--warn)}
.chip.ok{background:rgba(62,230,192,.15);color:var(--acc)}.chip.no{background:rgba(255,107,125,.15);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
#nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
#nav .in{pointer-events:auto;width:min(calc(100% - 28px),500px);display:flex;padding:7px;gap:4px;border-radius:34px;background:linear-gradient(145deg,rgba(30,50,50,.92),rgba(10,20,22,.92));border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
body.imm #nav{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:28px;color:#b6c8c4;font-size:13px;font-weight:700}
#nav button svg{width:26px;height:26px}
#nav button.on{color:var(--acc);background:linear-gradient(145deg,rgba(62,230,192,.25),rgba(62,230,192,.08));border:1.5px solid rgba(62,230,192,.5)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;padding:11px 18px;border-radius:16px;background:rgba(20,30,32,.96);border:1.5px solid var(--line);font-weight:700;font-size:14px;z-index:99;display:none;text-align:center}
.game{position:fixed;inset:0;z-index:40;background:#080a16;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gstage{position:relative;height:100%;overflow:hidden}
.gfr{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.gov{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(10,26,74,.55);padding:20px}
.gov.show{display:flex}
.gcard{width:min(100%,340px);background:#fff;color:#24307a;border-radius:24px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 #3b3d8f}
.gcard .l{font-size:30px;font-weight:900}.gcard .l span{color:#ff8a1f}
.gcard .s{font-size:14px;color:#5a63a8;line-height:1.45}
.gcard .e{font-size:34px;font-weight:900;color:#1fa86a}
.gb{padding:14px;border-radius:14px;font-weight:900;font-size:19px;background:#ff8a1f;color:#fff;box-shadow:0 5px 0 #c4600a}
.gb.g{background:#e7eaff;color:#3b3d8f;box-shadow:none;font-size:15px;padding:11px}
.field.sm{padding:11px 12px;font-size:15px;border-radius:13px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:12px 2px 6px}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.srow label{flex:1;font-size:14px}.srow label small{display:block;color:var(--muted);font-size:11px}
.srow input{width:110px;text-align:right}
</style>
<style id="fx-css">
/* ====== UZB cash bot: to'liq yonib turuvchi animatsiyali dizayn ====== */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--ease:cubic-bezier(.2,.8,.2,1)}
html{background:#060f11}
body{background:transparent}
/* --- jonli fon: suzuvchi nur dog'lari va uchqunlar --- */
#fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,#143a38 0,#0a1315 60%)}
body.imm #fx{display:none}
#fx i{position:absolute;border-radius:50%;filter:blur(64px);will-change:transform}
#fx i:nth-child(1){width:380px;height:380px;left:-140px;top:-80px;background:#1fb897;opacity:.5;animation:dr1 13s ease-in-out infinite alternate}
#fx i:nth-child(2){width:320px;height:320px;right:-130px;top:34%;background:#2a6fff;opacity:.22;animation:dr2 17s ease-in-out infinite alternate}
#fx i:nth-child(3){width:340px;height:340px;left:8%;bottom:-150px;background:#3ee6c0;opacity:.3;animation:dr3 15s ease-in-out infinite alternate}
#fx b{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:#7ff5da;box-shadow:0 0 10px #3ee6c0;opacity:0;animation:spark var(--t,12s) linear var(--w,0s) infinite}
@keyframes dr1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes dr2{to{transform:translate(-110px,-80px) scale(1.2)}}
@keyframes dr3{to{transform:translate(110px,-70px) scale(1.1)}}
@keyframes spark{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-108vh) scale(1.2);opacity:0}}
/* --- shisha kartalar: aylanuvchi yorqin hoshiya + nafas oluvchi nur --- */
.glass{position:relative;isolation:isolate}
.glass::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--a),transparent 0 58%,rgba(62,230,192,.15) 66%,rgba(62,230,192,.95) 84%,#c9fff4 89%,transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 6.5s linear var(--d,0s) infinite}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;box-shadow:0 0 30px 2px rgba(62,230,192,.28),inset 0 0 24px rgba(62,230,192,.07);opacity:.15;animation:breathe 4.6s ease-in-out var(--d,0s) infinite}
@keyframes spin{to{--a:360deg}}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.95}}
.glint{position:absolute;left:8%;bottom:-1px;width:92px;height:2px;border-radius:2px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,#8ff8e0,transparent);filter:drop-shadow(0 0 6px #3ee6c0);animation:glint 5s ease-in-out infinite alternate}
@keyframes glint{from{left:6%}to{left:64%}}
/* --- tugmalar, belgilar, rasm --- */
.btn{position:relative;overflow:hidden;transition:transform .15s}
.btn.p{box-shadow:0 0 22px rgba(62,230,192,.4);animation:btnglow 2.8s ease-in-out infinite}
.btn.p::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.4s ease-in-out infinite}
@keyframes btnglow{50%{box-shadow:0 0 34px rgba(62,230,192,.65)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.seg button{transition:background .3s,color .3s,box-shadow .3s}
.seg button.on,.tabs button.on{box-shadow:0 0 18px rgba(62,230,192,.55)}
.tabs button{transition:background .3s,color .3s,box-shadow .3s}
.pill.g{animation:pillglow 2.6s ease-in-out infinite}
@keyframes pillglow{50%{box-shadow:0 0 18px rgba(62,230,192,.45);border-color:rgba(62,230,192,.8)}}
.ava{animation:avapulse 3.2s ease-in-out infinite}
@keyframes avapulse{0%,100%{box-shadow:0 0 0 0 rgba(62,230,192,.5)}50%{box-shadow:0 0 0 7px rgba(62,230,192,0),0 0 20px rgba(62,230,192,.55)}}
.ib{transition:transform .15s}.ib:active{transform:scale(.9)}
.big{text-shadow:0 0 26px rgba(62,230,192,.35)}
.bar i{background-size:200% 100%;background-image:linear-gradient(90deg,#2fcfae,#b8fff0,#2fcfae);animation:barflow 2.4s linear infinite;box-shadow:0 0 14px rgba(62,230,192,.7)}
@keyframes barflow{to{background-position:-200% 0}}
.gc{transition:transform .2s var(--ease)}.gc:active{transform:scale(.96)}
.imgw{position:relative;border-radius:18px;overflow:hidden}
.imgw img{animation:float 5.5s ease-in-out infinite;transform-origin:center}
.imgw::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:shine 4.2s ease-in-out 1s infinite;pointer-events:none}
@keyframes float{50%{transform:scale(1.07)}}
.gc span{text-shadow:0 0 12px rgba(62,230,192,.6)}
.hrow .ic,.task .ic{box-shadow:0 0 14px rgba(62,230,192,.18)}
.a.p{text-shadow:0 0 12px rgba(62,230,192,.5)}
.chip{animation:pillglow 3s ease-in-out infinite}
.empty{animation:fadepulse 1.4s ease-in-out infinite}
@keyframes fadepulse{50%{opacity:.45}}
.linkbox{box-shadow:inset 0 0 18px rgba(62,230,192,.08)}
.field:focus{box-shadow:0 0 0 3px rgba(62,230,192,.18),0 0 22px rgba(62,230,192,.25)}
/* --- grafik --- */
.chart .ln{stroke-dasharray:1;stroke-dashoffset:0}
.pg.in .chart .ln{animation:draw 1.4s .3s var(--ease) backwards}
.pg.in .chart .ar{animation:fadein 1s .7s ease backwards}
.chart .pulse{fill:none;stroke:#3ee6c0;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
/* --- sahifalar orasidagi o'tish (videodagidek: eskisi siljib so'nadi, yangisi yonib kiradi) --- */
.pg{--dx:46px}
.pg.in{animation:pgin .5s var(--ease) backwards}
.pg.in>*{animation:rise .6s var(--ease) calc(var(--i,0)*55ms + 70ms) backwards}
.pg.data>*{animation:fadein .35s ease backwards}
.pg-out{animation:pgout .17s ease-in forwards;pointer-events:none}
@keyframes pgin{from{opacity:0;transform:translateX(calc(var(--dx)*var(--dir,1)));filter:blur(6px)}}
@keyframes pgout{to{opacity:0;transform:translateX(calc(var(--dx)*var(--dir,1)*-.7)) scale(.985);filter:blur(4px)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.965)}}
@keyframes fadein{from{opacity:0}}
/* --- pastki menyu: sirpanuvchi yonib turuvchi tabletka --- */
#nav .in{position:relative;gap:0;animation:navglow 4.5s ease-in-out infinite}
@keyframes navglow{50%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(62,230,192,.22)}}
#nav .in::before{content:"";position:absolute;left:12%;right:12%;bottom:-7px;height:6px;border-radius:0 0 30px 30px;background:linear-gradient(145deg,rgba(30,50,50,.8),rgba(10,20,22,.8));border:1.5px solid rgba(255,255,255,.12);border-top:0;z-index:-1}
#nav .pillbg{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/4);border-radius:28px;pointer-events:none;overflow:hidden;
  background:linear-gradient(145deg,rgba(62,230,192,.3),rgba(62,230,192,.08));border:1.5px solid rgba(62,230,192,.6);
  box-shadow:0 0 24px rgba(62,230,192,.4),inset 0 0 16px rgba(62,230,192,.18);
  transform:translateX(calc(var(--idx,0)*100%));transition:transform .55s cubic-bezier(.34,1.4,.5,1),opacity .35s}
#nav .pillbg::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:shine 3.2s ease-in-out infinite}
#nav.off .pillbg{opacity:0}
#nav button{position:relative;z-index:1;border:1.5px solid transparent;transition:color .3s,transform .15s}
#nav button:active{transform:scale(.92)}
#nav button.on{background:none;border-color:transparent;text-shadow:0 0 12px rgba(62,230,192,.7)}
#nav button svg{transition:transform .4s cubic-bezier(.34,1.6,.5,1),filter .3s}
#nav button.on svg{transform:translateY(-2px) scale(1.12);filter:drop-shadow(0 0 7px rgba(62,230,192,.8))}
/* --- toast, o'yin oynasi --- */
#toast{box-shadow:0 0 24px rgba(62,230,192,.25);animation:toastin .35s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-18px) scale(.95)}}
.game{animation:gamein .45s var(--ease)}
@keyframes gamein{from{opacity:0;transform:scale(1.06);filter:blur(8px)}}
.gov.show .gcard{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}}
/* --- admin: rasm ko'rinishi --- */
.prev{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;display:block;background:rgba(0,0,0,.35);border:1.5px solid var(--line)}
.prevw{width:104px;flex:none}
.prev.wide{aspect-ratio:auto;max-height:230px;object-fit:contain}
.arow{display:flex;gap:12px;align-items:center}
.field[type=file]{padding:9px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="fx"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="nav"><div class="in"></div></div>
<div id="toast"></div>
  <script type="text/plain" id="pio-css">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#dbeeff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#prog{top:calc(14px + var(--st,0px));left:14px;right:122px;height:30px;background:#5b55c7;border-radius:15px;border:3px solid #4640a8;overflow:hidden}
#progf{height:100%;width:1%;min-width:76px;background:#ff8a1f;border-radius:12px;display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 #b35a00;white-space:nowrap}
#gem{top:calc(8px + var(--st,0px));left:calc(14px + (100vw - 84px)/2);width:24px;height:24px;margin-left:-12px;background:#d84fe8;border:3px solid #fff;border-radius:6px;transform:rotate(45deg) scale(.8);box-shadow:0 0 0 2px #7a2d9c}

<script type="text/plain" id="pio-js">(()=>{
const W=180,H=180,N=W*H,SPEED=10.4,K=4;
const $=id=>document.getElementById(id);
const TILT=1,ROT=0,CRt=Math.cos(ROT),SRt=Math.sin(ROT);

let profName='',profPhoto='',myImg=null;

/* ---- ishlangan coin hisobi (asosiy ilova kurslarni yuboradi; to'lovni baribir server hisoblaydi) ---- */

const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function liveCoins(){
  const peak=Math.max(0,Math.min(1000,Math.round(best*10))),kills=Math.max(0,Math.min(100,me.kills|0));
  let c=Math.floor(peak*rates.pp/10)+kills*rates.pk;
  if(rates.mpm)c=Math.min(c,Math.floor(pt*rates.mpm/60));          /* serverdagi «daqiqasiga eng ko'p coin» himoyasi */
  return Math.max(0,c);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function earnTag(cx,by,fs){      /* o'yinchi tepasidagi «$ ishlangan coin» belgisi */
  const txt=fmtN(liveCoins())+' $';
  ctx.save();ctx.font=`900 ${fs}px ${FONT}`;
  const bw=Math.max(fs*4,ctx.measureText(txt).width+fs*1.5),bh=fs*1.7,x=cx-bw/2,y=by-bh,tw=Math.max(fs*3.4,bw*.6),th=fs*.85;
  ctx.fillStyle='#e8b923';rr(cx-tw/2,y-th+2,tw,th+8,fs*.3);ctx.fill();
  ctx.fillStyle='#3b2a00';ctx.font=`900 ${th*.72}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ISHLADI',cx,y-th/2+4);
  ctx.shadowColor='#2dff9a';ctx.shadowBlur=fs*.8;ctx.fillStyle='rgba(6,34,24,.94)';rr(x,y,bw,bh,fs*.55);ctx.fill();

}
let playing=false,GOALP=50,goalOn=false,tLimit=0,tLeft=0;
const sendUp=m=>{try{parent.postMessage(m,'*')}catch(e){}};
/* ---- arena (tuxum shakl) ---- */
const own=new Uint8Array(N),trl=new Uint8Array(N),ins=new Uint8Array(N);
function inside(x,y){const dy=y-92,dx=(x-90)/(1+.1*dy/80),t=Math.atan2(dy,dx);return Math.hypot(dx,dy)<=80*(1+.045*Math.cos(3*t+.6)+.03*Math.sin(2*t))}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let f=0;for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)if(inside(x+a/2,y+b/2))f=1;ins[y*W+x]=f}
const edge=[];
for(let a=0;a<160;a++){const t=a/160*6.2832,c=Math.cos(t),s=Math.sin(t);let r=0;while(inside(90+c*(r+.5),92+s*(r+.5)))r+=.5;edge.push([90+c*r,92+s*r])}

const isIn=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&inside(x,y)&&ins[(y|0)*W+(x|0)]===1;

/* ---- o'yinchilar ---- */
const PAL=['#ff8a1f','#ff4fd0','#27c9a0','#3fbf4a','#4f8dff','#a46bff','#ff4d4d','#f5c518','#00b8d9','#8bc34a'];

const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const pl=NAMES.map((n,i)=>({id:i,name:n,shape:0,col:'',v:[0,0,0],tr:'',t1:'',t2:'',bot:i>0,alive:false,trail:[],pts:[],px:0,py:0,cells:0,polys:null,face:'',photo:'',kills:0,x:90,y:92,cx:0,cy:0,hx:0,hy:0,ang:0,tx:0,rt:.5+i*.4,max:12,th:0}));
function setColor(p,c){const v=rgb(c);p.col=c;p.v=v;p.tr=`rgba(${v.map(c=>c*.7+76|0)},.9)`;p.t1=`rgb(${v.map(c=>c*.7|0)})`;p.t2=`rgb(${v.map(c=>Math.min(255,c*.55+115)|0)})`;p.lt=`rgb(${v.map(c=>c*.7+76|0)})`;p.dk=`rgb(${v.map(c=>c*.5|0)})`}

const BOT_PHOTOS=[];
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

  const bg=pk(['#ffd6a5','#bde0fe','#caffbf','#ffc6ff','#fdffb6','#a0c4ff','#ffadad','#9bf6ff']),

    hr=pk(['#2b1b12','#5a3825','#a0522d','#d9a441','#151515','#7a7a7a','#b5472f']),

  const cap=`<path d="M18 29c-1-13 6-19 14-19s15 6 14 19c-3-6-8-9-14-9s-11 3-14 9z" fill="${hr}"/>`;

  if(st===0)hair=cap;
  else if(st===1)hair=cap+`<rect x="17" y="28" width="5" height="18" rx="2.5" fill="${hr}"/><rect x="42" y="28" width="5" height="18" rx="2.5" fill="${hr}"/>`;
  else if(st===3)hair=`<path d="M18 27c0-9 6-14 14-14s14 5 14 14z" fill="${sh}"/><rect x="30" y="25" width="22" height="4" rx="2" fill="${sh}"/>`;
  return `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="${bg}"/><ellipse cx="32" cy="66" rx="24" ry="17" fill="${sh}"/><rect x="28" y="40" width="8" height="9" fill="${sk}"/><ellipse cx="32" cy="31" rx="13" ry="15" fill="${sk}"/>${hair}<circle cx="26.5" cy="32" r="1.9" fill="#222"/><circle cx="37.5" cy="32" r="1.9" fill="#222"/>${gl?'<g fill="none" stroke="#222" stroke-width="1.4"><circle cx="26.5" cy="32" r="4.4"/><circle cx="37.5" cy="32" r="4.4"/><path d="M31 32h2"/></g>':''}<path d="${sm?'M26 39q6 6 12 0':'M27 40q5 3 10 0'}" fill="none" stroke="#7a2e2e" stroke-width="1.7" stroke-linecap="round"/></svg>`;
}
{const a=PAL.slice().sort(()=>Math.random()-.5);pl.forEach((p,i)=>{setColor(p,a[i]);p.shape=Math.random()*3|0;p.face=faceSVG(i*7919+(Math.random()*1e9|0));p.photo=i&&BOT_PHOTOS.length?BOT_PHOTOS[(i-1)%BOT_PHOTOS.length]:''})}
const me=pl[0];

/* ---- hudud o'zgarishini kuzatish ---- */
let dB=null;
function dirty(i){const x=i%W,y=(i/W)|0;if(!dB)dB=[x,y,x,y];else{if(x<dB[0])dB[0]=x;if(y<dB[1])dB[1]=y;if(x>dB[2])dB[2]=x;if(y>dB[3])dB[3]=y}}

function spawn(p){

/* ---- effektlar: zarralar, halqa, iz-soya, ovoz ---- */
const parts=[],rings=[],ghosts=[],floats=[];
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
let nb=null,lastSnd=0;
function splash(vol){
  const ac=AC;if(!ac||vol<.1)return;
  const now=performance.now();if(now-lastSnd<140&&vol<1)return;lastSnd=now;
  const t=ac.currentTime;
  if(!nb){const len=ac.sampleRate*.5|0;nb=ac.createBuffer(1,len,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)}

  const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(2200,t);f.frequency.exponentialRampToValueAtTime(450,t+.4);
  const g=ac.createGain();g.gain.setValueAtTime(.5*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);
  src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t);
  for(let i=0;i<3;i++){
    const o=ac.createOscillator(),og=ac.createGain(),st=t+.04+i*.07+Math.random()*.05,f0=450+Math.random()*800;
    o.type='sine';o.frequency.setValueAtTime(f0,st);o.frequency.exponentialRampToValueAtTime(f0*2.3,st+.08);
    og.gain.setValueAtTime(.0001,st);og.gain.exponentialRampToValueAtTime(.2*vol,st+.01);og.gain.exponentialRampToValueAtTime(.0001,st+.13);
    o.connect(og);og.connect(ac.destination);o.start(st);o.stop(st+.16);
  }
}
function burst(x,y,col,n,sp){if(parts.length>600)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.7+Math.random()*.6,r:.07+Math.random()*.15,col})}}
function stepFx(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;const k=Math.max(0,1-2.4*dt);q.vx*=k;q.vy*=k;q.l-=dt/q.d;if(q.l<=0)parts.splice(i,1)}

  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].t+=dt/1.1;if(ghosts[i].t>=1)ghosts.splice(i,1)}

function makeGhost(p,cells){const d=new Float32Array(N);for(const i of cells)d[i]=1;blur(d);ghosts.push({p,polys:contour(d),t:0})}
function die(p,k,why){
  if(!p.alive)return;p.alive=false;
  if(p===me)me.cause=why?`${k.name} butun hududingizni egalladi`:k?`${k.name} izingizni kesdi`:'Siz o’z izingizga tegdingiz';
  const cells=[];for(let i=0;i<N;i++)if(own[i]===p.id+1)cells.push(i);
  const dist=Math.hypot(p.x-me.x,p.y-me.y),mine=p===me||k===me;
  if(mine||dist<45){
    if(cells.length)makeGhost(p,cells);
    burst(p.x,p.y,p.col,24,26);rings.push({x:p.x,y:p.y,t:0,col:p.col});
    for(let n=0;n<Math.min(50,cells.length);n++){const i=cells[Math.random()*cells.length|0];burst(i%W+.5,((i/W)|0)+.5,p.col,1,34)}
    splash(mine?1:1-dist/50);
  }

}
/* iz yopilganda: o'ralgan joylar egallanadi (eng katta tashqi bo'lak qoladi) */
function close(p){
  const id1=p.id+1;
  for(const i of p.trail){trl[i]=0;setOwn(i,id1)}p.trail=[];p.pts=[];
  const comp=new Int16Array(N),sz=[0],st=[];let nc=0;
  for(let s=0;s<N;s++){
    if(!ins[s]||own[s]===id1||comp[s])continue;
    nc++;comp[s]=nc;st.push(s);let n=0;
    while(st.length){
      const i=st.pop();n++;const x=i%W,y=(i/W)|0;
      for(let k=0;k<4;k++){
        const nx=x+(k===0?-1:k===1?1:0),ny=y+(k===2?-1:k===3?1:0);
        if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const j=ny*W+nx;if(ins[j]&&own[j]!==id1&&!comp[j]){comp[j]=nc;st.push(j)}
      }
    }
    sz.push(n);
  }
  let big=1;for(let c=2;c<=nc;c++)if(sz[c]>sz[big])big=c;
  for(let i=0;i<N;i++)if(comp[i]&&comp[i]!==big)setOwn(i,id1);
  const before=p.cells;recount();
  const gain=(p.cells-before)/AREA*100;if(gain>=.05)floats.push({p,txt:'+'+gain.toFixed(1)+'%',t:0});
  for(const o of pl)if(o!==p&&o.alive&&o.cells===0)die(o,p,1);
}
const GRACE=14;
function enter(p,cx,cy){
  const i=cy*W+cx,t=trl[i];

    const o=pl[t-1];
    if(o===p&&p.trail.lastIndexOf(i)>=p.trail.length-GRACE)return;
    die(o,o===p?null:p);if(!p.alive)return;
  }
  if(own[i]===p.id+1){if(p.trail.length)close(p)}
  else if(!trl[i]){trl[i]=p.id+1;p.trail.push(i);if(p.trail.length===1)p.pts=[[p.px,p.py]]}
}
function move(p,dt){
  const df=p.tx-p.ang,d=Math.atan2(Math.sin(df),Math.cos(df)),m=7*dt;
  p.ang+=Math.max(-m,Math.min(m,d));
  const dist=SPEED*dt,n=Math.ceil(dist/.8),s=dist/n,c=Math.cos(p.ang)*s,sn=Math.sin(p.ang)*s;
  for(let k=0;k<n;k++){
    let nx=p.x+c,ny=p.y+sn;
    if(!isIn(nx,ny)){
      let bd=1e9,bx=0,by=0;
      for(const a of[.4,-.4,.9,-.9,1.4,-1.4]){
        const ca=Math.cos(a),sa=Math.sin(a),mx=p.x+c*ca-sn*sa,my=p.y+c*sa+sn*ca;
        if(isIn(mx,my)){const e=Math.hypot(mx-nx,my-ny);if(e<bd){bd=e;bx=mx;by=my}}
      }
      if(bd>=1e9)continue;nx=bx;ny=by;
    }
    p.px=p.x;p.py=p.y;p.x=nx;p.y=ny;const cx=nx|0,cy=ny|0;
    if(cx!==p.cx||cy!==p.cy){p.cx=cx;p.cy=cy;enter(p,cx,cy);if(!p.alive)return}
    if(p.trail.length){const q=p.pts[p.pts.length-1];if(!q||Math.hypot(nx-q[0],ny-q[1])>.6)p.pts.push([nx,ny])}
  }
}
function think(b){
  const lx=b.x+Math.cos(b.ang)*6,ly=b.y+Math.sin(b.ang)*6;
  if(!isIn(lx,ly)){b.tx=Math.atan2(92-b.y,90-b.x)+(Math.random()-.5);return}
  const tt=trl[(ly|0)*W+(lx|0)];
  if(tt&&(tt===b.id+1||Math.random()<.6)){b.tx=b.ang+(Math.random()<.5?1:-1)*1.57;return}
  if(b.trail.length>b.max)b.tx=Math.atan2(b.hy-b.y,b.hx-b.x);
  else if(Math.random()<.3)b.tx=b.ang+(Math.random()-.5)*1.8;
  if(!b.trail.length)b.max=16+Math.random()*48|0;
}
function update(dt){
  for(const p of pl){
    if(!p.alive){if(p.bot&&running&&(p.rt-=dt)<=0)spawn(p);continue}
    if(p===me&&!playing)continue;
    if(p.bot&&(p.th-=dt)<=0){p.th=.12;think(p)}
    move(p,dt);
  }
  if(me.alive&&playing){const k=Math.min(1,dt*9);camX+=(me.x-camX)*k;camY+=(me.y-camY)*k}
  else{const b=pl.find(p=>p.bot&&p.alive);if(b){const k=Math.min(1,dt*2);camX+=(b.x-camX)*k;camY+=(b.y-camY)*k}}
  if(playing){
    if(tLimit){tLeft-=dt;if(tLeft<=0)finish('time')}
    if(goalOn&&pl.some(p=>p.alive&&pct(p)>=GOALP))finish('goal');
  }
  stepFx(dt);
}

/* ---- silliq hudud (blur + chegara) ---- */
const cv=$('g'),ctx=cv.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');
const dens=pl.map(()=>new Float32Array(N)),tmp=new Float32Array(N);
function blur(a){
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0;for(let k=-1;k<=1;k++){const xx=x+k;if(xx>=0&&xx<W)s+=a[y*W+xx]}tmp[y*W+x]=s/3}
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0;for(let k=-1;k<=1;k++){const yy=y+k;if(yy>=0&&yy<H)s+=tmp[yy*W+x]}a[y*W+x]=s/3}
  }
}
function contour(d){
  const T=.47,segs=[],adj=new Map();
  const add=(a,b)=>{const i=segs.length;segs.push([a,b]);for(const k of[a,b]){let l=adj.get(k);if(!l){l=[];adj.set(k,l)}l.push(i)}};
  for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){
    const a=d[y*W+x],b=d[y*W+x+1],c=d[(y+1)*W+x+1],e=d[(y+1)*W+x];
    const m=(a>T?8:0)|(b>T?4:0)|(c>T?2:0)|(e>T?1:0);
    if(m===0||m===15)continue;
    const tp=y*W+x,rt=N+y*W+x+1,bt=(y+1)*W+x,lf=N+y*W+x;
    switch(m){
      case 1:case 14:add(lf,bt);break;
      case 2:case 13:add(bt,rt);break;
      case 3:case 12:add(lf,rt);break;
      case 4:case 11:add(tp,rt);break;
      case 6:case 9:add(tp,bt);break;
      case 7:case 8:add(lf,tp);break;
      case 5:if((a+b+c+e)/4>T){add(lf,tp);add(bt,rt)}else{add(tp,rt);add(lf,bt)}break;
      case 10:if((a+b+c+e)/4>T){add(tp,rt);add(lf,bt)}else{add(lf,tp);add(bt,rt)}break;
    }
  }
  const pt=k=>{
    if(k<N){const y=(k/W)|0,x=k%W,v0=d[k],v1=d[k+1];return[x+(T-v0)/(v1-v0)+.5,y+.5]}
    const q=k-N,y=(q/W)|0,x=q%W,v0=d[q],v1=d[q+W];return[x+.5,y+(T-v0)/(v1-v0)+.5];
  };

  for(let s=0;s<segs.length;s++){
    if(used[s])continue;used[s]=1;
    const start=segs[s][0];let cur=segs[s][1];const L=pt(start);
    for(let g=0;g<30000;g++){
      if(cur===start)break;
      const q=pt(cur);L.push(q[0],q[1]);
      const nx=(adj.get(cur)||[]).find(i=>!used[i]);
      if(nx===undefined)break;
      used[nx]=1;const sg=segs[nx];cur=sg[0]===cur?sg[1]:sg[0];
    }
    if(L.length>=6)loops.push(L);
  }

}
function trace(polys,cs){
  ctx.beginPath();
  for(const L of polys){
    const n=L.length/2;if(n<3)continue;
    ctx.moveTo((L[n*2-2]+L[0])/2*cs,(L[n*2-1]+L[1])/2*cs);
    for(let i=0;i<n;i++){
      const j=(i+1)%n;
      ctx.quadraticCurveTo(L[i*2]*cs,L[i*2+1]*cs,(L[i*2]+L[j*2])/2*cs,(L[i*2+1]+L[j*2+1])/2*cs);
    }
    ctx.closePath();
  }
}
function flush(){

    if(!pd[i])continue;pd[i]=0;const p=pl[i];

let dpr=1;

addEventListener('resize',resize);resize();
const FONT='"Trebuchet MS","Segoe UI",sans-serif';
function draw(){
  const w=cv.width,h=cv.height,cs=Math.min(w,h)/34,U=cs*2,cx0=w/2,cy0=h*.56;
  const prj=(x,y)=>{const dx=x-camX,dy=y-camY;return[cx0+(dx*CRt-dy*SRt)*cs,cy0+(dx*SRt+dy*CRt)*cs*TILT]};
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(cx0,cy0);ctx.scale(1,TILT);ctx.rotate(ROT);ctx.translate(-camX*cs,-camY*cs);
  const path=()=>{ctx.beginPath();edge.forEach((e,i)=>i?ctx.lineTo(e[0]*cs,e[1]*cs):ctx.moveTo(e[0]*cs,e[1]*cs));ctx.closePath()};
  path();ctx.fillStyle='#dbeeff';ctx.fill();
  ctx.save();path();ctx.clip();
  const land=(list,al)=>{
    ctx.globalAlpha=al;ctx.lineJoin='round';
    for(const o of list){ctx.save();ctx.translate(0,U*.14);trace(o.polys,cs);ctx.fillStyle=o.p.dk;ctx.fill('evenodd');ctx.restore()}
    for(const o of list){trace(o.polys,cs);ctx.fillStyle=o.p.lt;ctx.fill('evenodd');ctx.strokeStyle=o.p.dk;ctx.lineWidth=Math.max(2*dpr,U*.1);ctx.stroke()}

  ctx.lineCap='butt';ctx.lineJoin='round';

    const tr=()=>{ctx.beginPath();p.pts.forEach((q,k)=>k?ctx.lineTo(q[0]*cs,q[1]*cs):ctx.moveTo(q[0]*cs,q[1]*cs));ctx.lineTo(p.x*cs,p.y*cs)};

    ctx.fillStyle=p.t1;for(let k=3;k>0;k--){shape(X,Y+r*.1*k);ctx.fill()}
    shape(X,Y);ctx.fillStyle=p.col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5*dpr;ctx.stroke();
    ctx.font=`900 ${U*.4*f}px ${FONT}`;ctx.lineWidth=3*dpr;ctx.strokeStyle='#fff';ctx.fillStyle='#24307a';

}

  for(const p of pl){if(!p.polys)continue;mctx.fillStyle=p.col;mctx.beginPath();for(const L of p.polys){for(let k=0;k<L.length;k+=2){const X=o+L[k]*s,Y=o+L[k+1]*s;k?mctx.lineTo(X,Y):mctx.moveTo(X,Y)}mctx.closePath()}mctx.fill('evenodd')}
  mctx.restore();mp();mctx.strokeStyle='#3b3d8f';mctx.lineWidth=4;mctx.lineJoin='round';mctx.stroke();
  for(const p of pl){if(!p.alive)continue;mctx.fillStyle=p.col;mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.beginPath();mctx.arc(o+p.x*s,o+p.y*s,p===me?5:3.2,0,7);mctx.fill();mctx.stroke()}
}

/* ---- boshqaruv ---- */
const joy=$('joy'),knob=$('knob'),jbs={u:joy.querySelector('.u'),d:joy.querySelector('.d'),l:joy.querySelector('.l'),r:joy.querySelector('.r')};
let cfg={mode:'any',pos:'c'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('pa_cfg')||'{}'))}catch(e){}
function applyCfg(){
  joy.dataset.pos=cfg.pos;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===cfg.mode));
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('sel',b.dataset.p===cfg.pos));
  try{localStorage.setItem('pa_cfg',JSON.stringify(cfg))}catch(e){}
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;applyCfg()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cfg.pos=b.dataset.p;applyCfg()});
$('gear').onclick=()=>$('set').classList.toggle('show');
$('sclose').onclick=()=>$('set').classList.remove('show');
applyCfg();
let jid=null,org=null;
function pad(dx,dy){
  const R=46,r=Math.hypot(dx,dy),k=Math.min(r,R)/(r||1),nx=dx*k/R,ny=dy*k/R;
  knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
  jbs.u.classList.toggle('on',ny<-.4);jbs.d.classList.toggle('on',ny>.4);jbs.l.classList.toggle('on',nx<-.4);jbs.r.classList.toggle('on',nx>.4);
}
function steer(e){
  const dx=e.clientX-org.x,dy=e.clientY-org.y;
  if(Math.hypot(dx,dy)>7)me.tx=scr2world(dx,dy);
  pad(dx,dy);
}
addEventListener('pointerdown',e=>{
  if(e.target.closest('.ui')||!playing||e.pointerType==='mouse')return;
  const b=joy.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  if(cfg.mode==='pad'){
    if(Math.abs(e.clientX-cx)>b.width/2+40||Math.abs(e.clientY-cy)>b.height/2+40)return;
    org={x:cx,y:cy};
  }else org={x:e.clientX,y:e.clientY};
  audio();jid=e.pointerId;steer(e);
});
addEventListener('pointermove',e=>{if(e.pointerId===jid)steer(e)});
const up=e=>{if(e.pointerId!==jid)return;jid=null;pad(0,0)};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
const KEY={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};
addEventListener('keydown',e=>{
  if(e.code==='Space'){if(playing){e.preventDefault();setHide(!hide)}return}
  const v=KEY[e.key];if(v&&playing){me.tx=scr2world(v[0],v[1]);pad(v[0]*40,v[1]*40)}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&playing)e.preventDefault()});
addEventListener('contextmenu',e=>e.preventDefault());
/* ---- sichqoncha (kompyuter / Telegram Web) ---- */
let hide=false,locked=false,vx=0,vy=0,tipShown=false;
function setHide(on){
  hide=on;document.body.classList.toggle('nocur',on);$('mhide').classList.toggle('sel',on);
  if(on){
    $('set').classList.remove('show');
    vx=Math.cos(me.tx)*40;vy=Math.sin(me.tx)*40;
    try{const r=cv.requestPointerLock&&cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(err){}
  }else{try{document.exitPointerLock&&document.exitPointerLock()}catch(err){}}
}
$('mhide').onclick=()=>setHide(!hide);
document.addEventListener('pointerlockchange',()=>{
  const was=locked;locked=document.pointerLockElement===cv;
  if(was&&!locked&&hide)setHide(false);
});
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||!playing)return;
  if(!tipShown){tipShown=true;const t=$('tip');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),6000)}
  if(locked){
    vx+=e.movementX;vy+=e.movementY;const r=Math.hypot(vx,vy);
    if(r>70){vx*=70/r;vy*=70/r}
    if(r>6)me.tx=scr2world(vx,vy);
    pad(vx*.65,vy*.65);return;
  }
  if(e.target instanceof Element&&e.target.closest('.ui'))return;
  const dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight*.56;
  if(Math.hypot(dx,dy)>24)me.tx=scr2world(dx,dy);
  pad(dx,dy);
});

/* ---- oqim (asosiy ilova boshqaradi) ---- */
function finish(why){
  if(!playing)return;playing=false;if(hide)setHide(false);
  const areas=pl.map(p=>Math.max(0,Math.round(p.cells/AREA*1000)));
  let sum=areas.reduce((a,b)=>a+b,0);
  while(sum>1000){const k=areas.indexOf(Math.max(...areas));areas[k]--;sum--}
  sendUp({type:'end',why,areas,kills:me.kills,peak:Math.round(best*10),cause:me.cause||'',names:pl.map(p=>p.name),cols:pl.map(p=>p.col),kl:pl.map(p=>p.kills)});
}
function startRound(m){
  own.fill(0);trl.fill(0);parts.length=0;rings.length=0;ghosts.length=0;floats.length=0;
  const a=PAL.slice().sort(()=>Math.random()-.5);
  pl.forEach((p,i)=>{p.alive=false;p.trail=[];p.pts=[];p.cells=0;p.polys=null;p.kills=0;p.rt=0;p.th=0;setColor(p,a[i]);p.shape=Math.random()*3|0});
  pd.fill(0);
  profName=(m.name||'Mehmon').toString().slice(0,14);profPhoto=m.photo||'';
  myImg=null;if(profPhoto){myImg=new Image();myImg.referrerPolicy='no-referrer';myImg.src=profPhoto}
  me.name=profName;me.face=faceSVG(Math.random()*1e9|0);me.cause='';
  GOALP=m.goal||50;goalOn=!!m.goal;tLimit=m.round||0;tLeft=tLimit;$('tm').classList.toggle('on',!!tLimit);
  best=0;pt=0;lastSent='';pl.slice(1).forEach(spawn);spawn(me);camX=me.x;camY=me.y;playing=true;hide=false;
  audio();
}
addEventListener('message',e=>{
  const m=e.data;if(!m||typeof m!=='object')return;
  if(m.type==='safe'){const r=document.documentElement.style;r.setProperty('--st',(m.top||0)+'px');r.setProperty('--sb',(m.bottom||0)+'px')}
  else if(m.type==='start')startRound(m);
  else if(m.type==='rates')rates={pp:+m.pp||0,pk:+m.pk||0,mpm:+m.mpm||0};
  else if(m.type==='pause')paused=true;           /* YouTube video moduli: video muammosida o'yinni to'xtatadi */
  else if(m.type==='resume')paused=false;
});
$('bk').onclick=()=>sendUp(playing?{type:'exit',peak:Math.round(best*10),kills:me.kills}:{type:'exit'});
pl.slice(1).forEach(spawn);
let paused=false;
let last=performance.now(),hT=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused){update(dt);if(playing)pt+=dt}
  flush();draw();
  if((hT-=dt)<=0){hT=.2;hud();drawMini()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
sendUp({type:'ready'});
})();
</script>

  <script type="text/plain" id="sl-js">(()=>{
/* Bull slither: 15 daqiqa, torayuvchi zona, coinlar 0.01 / 0.05 / 0.1. Ilon faqat boshqa ilon tanasiga urilsa yoki zonada ochkosi tugasa yutqazadi. */
const $=id=>document.getElementById(id);
const T_TOTAL=900,R0=2400,R1=380,EDGE=2600,NB=12,NCOIN=1800;
const VAL=[.01,.05,.1],CR=[4.5,7,10.5],CC=[[255,62,78],[255,196,64],[72,255,170]];   /* qizil (0.01) · oltin (0.05) · yashil (0.1) — to'q fonda yarqiraydi */
const NAMES=['Zebra','Kobra','Burgut','Qoplon','Tulpor','Bahor','Sherxon','Mirzo','Laylo','Dilya','Aziz','Rustam','Nilufar','Sardor','Madina','Jasur','Gulnoz','Bobur','Ozoda'];
const HUES=[352,148,32,272,188,322,52,100,242,12,168,292,72,202];
const rnd=(a,b)=>a+Math.random()*(b-a);
const sendUp=m=>{try{parent.postMessage(m,'*')}catch(e){}};
const cv=$('g'),ctx=cv.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
/* ---- profil ---- */
let profName='Mehmon',top=[],mine={best:0};
/* ---- ishlangan coin hisobi (asosiy ilova kurslarni yuboradi; to'lovni baribir server hisoblaydi) ---- */
let rates={k:0,mpm:0},lastSent=-1;
const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function liveCoins(){
  if(!rates.k)return 0;
  let c=Math.floor(Math.max(0,Math.round(peak*10)-10)*rates.k/10);
  if(rates.mpm)c=Math.min(c,Math.floor(t*rates.mpm/60));          /* serverdagi «daqiqasiga eng ko'p coin» himoyasi */
  return Math.max(0,c);
}
/* ---- yarqiroq coin spritelari ---- */
const glow=CC.map((c,t)=>{const s=64,k=document.createElement('canvas');k.width=k.height=s;const g=k.getContext('2d'),r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  r.addColorStop(0,'rgba(255,255,255,.95)');r.addColorStop(.22,`rgba(${c[0]},${c[1]},${c[2]},.85)`);r.addColorStop(.55,`rgba(${c[0]},${c[1]},${c[2]},.25)`);r.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
  g.fillStyle=r;g.fillRect(0,0,s,s);return k});
/* ---- holat ---- */
let state='menu',t=0,sc=1,camX=0,camY=0,aim=0,peak=1,why='',rank=0;
let snakes=[],coins=[],drops=[],fx=[];
const zoneR=()=>R0-(R0-R1)*Math.min(1,t/T_TOTAL);
const slen=s=>Math.round(10+Math.min(150,s*9));
const srad=s=>7+Math.min(15,Math.sqrt(Math.max(0,s))*2.2);
function mkCoin(inZone,x,y,ty){
  if(x===undefined){const zr=zoneR(),a=Math.random()*6.2832,r=Math.sqrt(Math.random())*(inZone?zr*.98:EDGE*.97);x=Math.cos(a)*r;y=Math.sin(a)*r}
  if(ty===undefined){const q=Math.random();ty=q<.68?0:q<.93?1:2}
  return {x,y,t:ty,p:Math.random()*6.28,vx:0,vy:0};
}
function init(){
  const names=NAMES.slice().sort(()=>Math.random()-.5);
  snakes=[];
  for(let i=0;i<=NB;i++)snakes.push({id:i,bot:i>0,name:i?names[i-1]:profName,hue:i?HUES[(i-1)%HUES.length]:212,seg:[],ang:0,want:0,score:1,alive:false,resp:0,think:0,turn:i?3.1:4.6,speed:i?120+Math.random()*12:135,out:false});
}
function spawn(s){
  let bx=0,by=0;
  for(let k=0;k<30;k++){
    const zr=zoneR()*.8,a=Math.random()*6.2832,r=Math.sqrt(Math.random())*zr,x=Math.cos(a)*r,y=Math.sin(a)*r;let ok=true;
    for(const o of snakes)if(o!==s&&o.alive&&Math.hypot(o.seg[0].x-x,o.seg[0].y-y)<260){ok=false;break}
    if(ok){bx=x;by=y;break}
  }
  s.ang=Math.random()*6.2832;s.want=s.ang;s.score=1;s.alive=true;s.resp=0;s.seg=[];
  const n=slen(1),sp=srad(1)*.75;
  for(let i=0;i<n;i++)s.seg.push({x:bx-Math.cos(s.ang)*sp*i,y:by-Math.sin(s.ang)*sp*i});
}
function newRound(){
  t=0;coins=[];drops=[];fx=[];peak=1;
  for(let i=0;i<NCOIN;i++)coins.push(mkCoin(i%5!==0));
  snakes.forEach(s=>{s.alive=false});
  snakes.forEach(spawn);
  const me=snakes[0];camX=me.seg[0].x;camY=me.seg[0].y;aim=me.ang;
}
/* o'lgan ilonning ochkolari yoyilib qoladi — yeb olinadi */
function scatter(s){
  let rest=s.score*.85,n=0;const L=s.seg.length,r=srad(s.score);
  while(rest>=.0099&&n<320){
    const ty=rest>=.1?2:rest>=.05?1:0;rest-=VAL[ty];n++;
    const q=s.seg[(Math.random()*L)|0],a=Math.random()*6.2832,v=rnd(30,170);
    const c=mkCoin(true,q.x+rnd(-r,r),q.y+rnd(-r,r),ty);c.vx=Math.cos(a)*v;c.vy=Math.sin(a)*v;
    if(Math.hypot(c.x,c.y)<EDGE){coins.push(c);drops.push(c)}
  }
}
function kill(s,byZone){
  if(!s.alive)return;s.alive=false;
  const col=`hsl(${s.hue},80%,60%)`;

function steer(s){
  const h=s.seg[0],zr=zoneR(),d=Math.hypot(h.x,h.y);let want=s.ang;
  if(d>zr-90)want=Math.atan2(-h.y,-h.x);

    let best=null,bs=0;
    for(const c of coins){const dx=c.x-h.x,dy=c.y-h.y,dd=dx*dx+dy*dy;if(dd>360000)continue;const q=VAL[c.t]/(Math.sqrt(dd)+40);if(q>bs){bs=q;best=c}}
    if(best)want=Math.atan2(best.y-h.y,best.x-h.x);else if(Math.random()<.3)want=s.ang+rnd(-1,1);
  }
  const r=srad(s.score),la=r*6+40,px=h.x+Math.cos(s.ang)*la,py=h.y+Math.sin(s.ang)*la;
  out:for(const o of snakes){
    if(o===s||!o.alive)continue;const ro=srad(o.score);
    for(let k=1;k<o.seg.length;k+=2){
      if(Math.abs(o.seg[k].x-px)<ro+r+18&&Math.abs(o.seg[k].y-py)<ro+r+18){
        const cr=Math.cos(s.ang)*(o.seg[k].y-h.y)-Math.sin(s.ang)*(o.seg[k].x-h.x);want=s.ang+(cr>0?-1.4:1.4);break out;

    }
  }

}
function step(dt){
  if(state==='play')t+=dt;
  const zr=zoneR();
  for(const s of snakes){
    if(!s.alive){if(s.bot&&s.resp&&t>=s.resp&&state==='play')spawn(s);continue}
    if(state!=='play'&&!s.bot)continue;
    if(s.bot){if((s.think-=dt)<=0){s.think=.12;steer(s)}}else s.want=aim;
    let da=s.want-s.ang;da=Math.atan2(Math.sin(da),Math.cos(da));const mx=s.turn*dt;s.ang+=Math.max(-mx,Math.min(mx,da));
    const h=s.seg[0];h.x+=Math.cos(s.ang)*s.speed*dt;h.y+=Math.sin(s.ang)*s.speed*dt;
    const dc=Math.hypot(h.x,h.y);if(dc>EDGE){h.x*=EDGE/dc;h.y*=EDGE/dc}
    const r=srad(s.score),sp=r*.75,n=slen(s.score);
    while(s.seg.length<n){const tl=s.seg[s.seg.length-1];s.seg.push({x:tl.x,y:tl.y})}
    while(s.seg.length>n)s.seg.pop();
    for(let i=1;i<s.seg.length;i++){const p=s.seg[i-1],q=s.seg[i],dx=p.x-q.x,dy=p.y-q.y,dd=Math.hypot(dx,dy);if(dd>sp){const f=(dd-sp)/dd;q.x+=dx*f;q.y+=dy*f}}
    /* coin: yaqinlashganda tortiladi, keyin yeyiladi */
    const mag=r*2.4+36;
    for(let c=coins.length-1;c>=0;c--){
      const co=coins[c],ex=h.x-co.x,ey=h.y-co.y,d2=ex*ex+ey*ey;
      if(d2>mag*mag)continue;
      const d=Math.sqrt(d2);
      if(d<r+CR[co.t]*.6+4){
        s.score+=VAL[co.t];coins.splice(c,1);
        if(coins.length<NCOIN)coins.push(mkCoin(Math.random()<.85));
        if(!s.bot){fx.push({x:co.x,y:co.y,vx:0,vy:-45,life:.55,c:`rgb(${CC[co.t]})`,txt:'+'+VAL[co.t].toFixed(2)});try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}}
      }else{const k=Math.min(1,dt*7);co.x+=ex*k;co.y+=ey*k}
    }
    if(dc<=zr){s.score+=dt*s.score*.002;s.out=false}else{s.score-=dt*(.03+s.score*.04);s.out=true}
    if(!s.bot&&s.score>peak)peak=s.score;
    if(s.score<=.001){s.score=0;kill(s,true);continue}
    for(const o of snakes){
      if(o===s||!o.alive)continue;
      const ro=srad(o.score),lim=r*.7+ro*.85,span=o.seg.length*ro*.8+80;
      if(Math.abs(o.seg[0].x-h.x)>span&&Math.abs(o.seg[0].y-h.y)>span)continue;
      for(let k=1;k<o.seg.length;k++){const ox=o.seg[k].x-h.x,oy=o.seg[k].y-h.y;if(ox*ox+oy*oy<lim*lim){kill(s,false);break}}
      if(!s.alive)break;
    }
  }
  for(let i=drops.length-1;i>=0;i--){const c=drops[i];c.x+=c.vx*dt;c.y+=c.vy*dt;const k=Math.max(0,1-dt*4);c.vx*=k;c.vy*=k;if(Math.abs(c.vx)+Math.abs(c.vy)<2)drops.splice(i,1)}

  if(state==='play'&&t>=T_TOTAL){state='over';why='time';over()}
}
